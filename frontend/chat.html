<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chat - Knowledge Chatbot</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="chat-container">
            <div class="chat-header">
                <h1>🤖 Knowledge Chatbot</h1>
                <div class="user-info">
                    <span id="username-display">Loading...</span>
                    <select id="searchMethod" class="method-selector">
                        <option value="dialogflow">Dialogflow (NLU)</option>
                        <option value="semantic">Semantic Search (Cached)</option>
                        <option value="keyword">Keyword Search (Fast)</option>
                    </select>

                    <button id="logoutBtn" class="btn-secondary">Logout</button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="welcome-message">
                    <h2>Welcome! 👋</h2>
                    <p>Ask me anything about general knowledge - history, science, geography, or
                        famous people!</p>
                </div>
            </div>

            <div class="loading hidden" id="loading">
                <div class="loader"></div>
                <span>Thinking...</span>
            </div>

            <form id="chatForm" class="chat-input-form">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Authenticating..."
                    disabled
                    required>
                <button type="submit" class="btn-primary">Send</button>
            </form>
        </div>

        <script type="module" src="chat.js"></script>
    </body>
</html>
