<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader p {
            font-size: 16px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Loading Knowledge Chatbot...</p>
    </div>

    <script type="module">
        console.log('Root index: Checking authentication...');
        
        async function initAndRedirect() {
            try {
                // Fetch Firebase config from server
                const response = await fetch('/api/firebase-config');
                if (!response.ok) throw new Error('Failed to fetch config');
                
                const firebaseConfig = await response.json();

                // Import Firebase modules
                const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
                const { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');

                // Initialize Firebase
                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                
                // Set persistence
                await setPersistence(auth, browserLocalPersistence);

                // Check auth state and redirect
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        console.log('User logged in:', user.email, '-> Redirecting to chat');
                        window.location.replace('/frontend/chat.html');
                    } else {
                        console.log('No user -> Redirecting to login');
                        window.location.replace('/frontend/login.html');
                    }
                });

            } catch (error) {
                console.error('Initialization error:', error);
                setTimeout(() => {
                    window.location.replace('/frontend/login.html');
                }, 1000);
            }
        }

        initAndRedirect();
    </script>
</body>
</html>
